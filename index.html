<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Модуль расчёта</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Модуль расчёта показателей</h1>

<form method="post" enctype="multipart/form-data">

    <p>
        <label>
            <input type="radio" name="mode" value="manual" checked>
            Ввод вручную
        </label>

        <label>
            <input type="radio" name="mode" value="file">
            Загрузка файла
        </label>
    </p>

    <p>
        Введите числа через запятую:
        <br>
        <input type="text" name="numbers" placeholder="10,20,30">
    </p>

    <p>
        Выберите JSON-файл:
        <br>
        <input type="file" name="file" accept=".json">
    </p>

    <button type="submit">Рассчитать</button>
</form>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

{% if result %}
<h2>Результаты:</h2>
<ul>
    <li>Сумма: {{ result.sum }}</li>
    <li>Среднее: {{ result.average }}</li>
    <li>Максимум: {{ result.max }}</li>
    <li>Минимум: {{ result.min }}</li>
</ul>
{% endif %}

</body>
</html>
